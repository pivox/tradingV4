# CI tradingV4 (docs/03-architecture.md §3 ligne Qualité, §4 et §11 S1).
# Sans filtrage par chemin : chaque push et chaque pull request passe tout le contrôle.
# Jobs : `qualite` (format, clippy, tests, doubles runs de fumée avec `tv4 verify` pour le chemin mono-paire,
# pour le portefeuille, pour les profils de coûts s10 et pour la recherche s11 à deux lignes, fumée de
# `tv4 costs calibrate-stress`, fumée de `tv4 universe build` et `survivorship`, couverture),
# `bench` (criterion `engine_2y_1m` et sa porte ; les groupes informatifs `engine_portfolio_2y_1m_2legs` et
# `engine_portfolio_profiles_2y_1m_2legs` ne sont pas lancés ici), `control-plane` (PHP : composer, phpcs,
# phpstan, phpunit) et `rapport-bout-en-bout` (rend avec le control plane les runs et le dossier de lignes écrits
# par `tv4`).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Ne définir ni RUSTFLAGS ni CARGO_ENCODED_RUSTFLAGS (même vides) : elles remplaceraient les rustflags
  # de `.cargo/config.toml` et feraient perdre `-C target-cpu=x86-64-v3`.

jobs:
  qualite:
    name: Format, clippy, tests, couverture
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # Toolchain installée explicitement, au lieu de laisser rustup la déduire de rust-toolchain.toml.
      # llvm-tools-preview n'est demandé qu'ici : cargo-llvm-cov en a besoin, pas le poste local.
      - name: Installer Rust 1.97.0
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy, llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Installer cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --locked --all-targets

      # Binaire debug (opt-level = 1) : les opérations IEEE ne dépendent pas du niveau d'optimisation
      # (pas de contraction FMA, docs/03 §7.4) et les valeurs épinglées des tests tournent déjà en debug.
      - name: Construire le binaire
        run: cargo build --locked --bin tv4

      # Même job, deux process : le double run que les tests Rust ne font que depuis un test. `tv4 verify`
      # compare metrics.json, trades.csv et equity.csv à l'octet (code 0 identiques, 3 différents).
      - name: Backtest de fumée, deux process, et tv4 verify
        run: |
          set -euo pipefail
          for r in a b; do
            ./target/debug/tv4 backtest --fixture fixtures/kraken_xbtusd_1m.csv --strategy sma_cross \
              --params config/strategies/sma_cross.toml --fees okx --out runs/fumee-$r
          done
          ./target/debug/tv4 verify runs/fumee-a runs/fumee-b
          ./target/debug/tv4 backtest --fixture fixtures/kraken_xbtusd_1m.csv --strategy sma_cross \
            --params config/strategies/sma_cross.toml --fees bitvavo_usdc --out runs/fumee-bitvavo

      # Portefeuille (docs/specs/s9.md §18, lot H) : même principe, deux process, sur un dataset à deux
      # séries. La fixture Kraken réelle est ingérée sous deux symboles (BTC-USD et ETH-USD) : les deux
      # jambes ont donc les mêmes bougies, ce qui suffit pour un test de déterminisme et de chaîne, pas
      # pour un résultat (le verdict attendu est `rejected_too_few_trades`). Les minimums viennent du
      # fichier d'instruments de test `tv4/tests/fixtures/okx_instruments_spot.json` (valeurs inventées,
      # aucun secret). `tv4 verify` compare aussi le capital et les identités de l'entonnoir par paire.
      - name: Backtest de fumée du portefeuille, deux process, et tv4 verify
        run: |
          set -euo pipefail
          for s in BTC-USD ETH-USD; do
            ./target/debug/tv4 ingest csv --root smoke-s9 --csv fixtures/kraken_xbtusd_1m.csv \
              --exchange kraken --symbol "$s" --tf 1m
          done
          ./target/debug/tv4 dataset build --root smoke-s9 --name fumee_duo --exchange kraken \
            --symbol BTC-USD --symbol ETH-USD --tf 1m --from 2020-01-01T00:00:00Z --to 2020-01-09T00:00:00Z
          for r in a b; do
            ./target/debug/tv4 backtest --root smoke-s9 --dataset fumee_duo --strategy sma_cross \
              --params config/strategies/sma_cross.toml --fees okx --symbols BTC-USD,ETH-USD \
              --max-positions 8 --sizing research --capital 300 \
              --instruments-okx tv4/tests/fixtures/okx_instruments_spot.json --out runs/portefeuille-$r
          done
          ./target/debug/tv4 verify runs/portefeuille-a runs/portefeuille-b

      # Profils de coûts (docs/specs/s10.md §14 et §17, lot H) : même dataset `fumee_duo` que l'étape
      # précédente (même job, même racine `smoke-s9`), `--costs config/costs.toml`, deux process, puis
      # `tv4 verify` sur les deux dossiers de profils (trois runs et `profiles.json`). Un troisième run avec
      # `--fees okx_regular` doit écrire le même `profiles.json` que `--fees okx` : `okx` est l'alias
      # d'analyse de `okx_regular`, et le nom de grille haché est le même. Même réserve que pour le
      # portefeuille : marché de la fixture réelle sur deux symboles, donc un test de chaîne et de
      # déterminisme, sans résultat (verdict attendu `rejected_too_few_trades`, étiquette indéterminée).
      - name: Backtest de fumée des profils de coûts, deux process, et tv4 verify
        run: |
          set -euo pipefail
          for r in a b; do
            ./target/debug/tv4 backtest --root smoke-s9 --dataset fumee_duo --strategy sma_cross \
              --params config/strategies/sma_cross.toml --fees okx --symbols BTC-USD,ETH-USD \
              --max-positions 8 --sizing research --capital 300 \
              --instruments-okx tv4/tests/fixtures/okx_instruments_spot.json \
              --costs config/costs.toml --out runs/profils-$r
          done
          ./target/debug/tv4 verify runs/profils-a runs/profils-b
          ./target/debug/tv4 backtest --root smoke-s9 --dataset fumee_duo --strategy sma_cross \
            --params config/strategies/sma_cross.toml --fees okx_regular --symbols BTC-USD,ETH-USD \
            --max-positions 8 --sizing research --capital 300 \
            --instruments-okx tv4/tests/fixtures/okx_instruments_spot.json \
            --costs config/costs.toml --out runs/profils-regular
          cmp runs/profils-a/profiles.json runs/profils-regular/profiles.json

      # Calibration du stress (docs/specs/s10.md §11 et §14.2) sur le dataset de la fumée : sept jours de
      # 1m, donc des TF 1h et 4h (le 1d n'a pas les 14 bougies de l'ATR). C'est un contrôle de plomberie,
      # pas une mesure : le fichier est écrit au schéma, et deux runs sur les mêmes données donnent le même
      # `measurement_hash` (`created_at` et `commit` n'y entrent pas). Chaque run a son `--out`, car la
      # commande n'écrase jamais un fichier existant.
      - name: Fumée de tv4 costs calibrate-stress
        run: |
          set -euo pipefail
          for r in a b; do
            ./target/debug/tv4 costs calibrate-stress --root smoke-s9 --dataset fumee_duo \
              --tf 1h --tf 4h --out runs/calibration/stress-$r.json
          done
          test "$(jq -r .schema runs/calibration/stress-a.json)" = "tv4-stress-calibration-v1"
          test "$(jq -r .measurement_hash runs/calibration/stress-a.json)" = "$(jq -r .measurement_hash runs/calibration/stress-b.json)"

      # Recherche (docs/specs/s11.md §14, lot H) : la fixture réelle (2020-01, dans le bloc DEV) est ingérée, puis
      # le dataset de bloc `fumee_dev` est construit (`--block DEV` : fenêtre de décision [2018-01-01, 2023-01-01),
      # chauffe de 210 jours, `zero_volume_marked`). Un run en symboles fixes, puis deux process avec la liste
      # figée `tv4-pair-subset-v1` dérivée de la fixture d'instruments de test (valeurs inventées, aucun secret)
      # écrivent `full/`, `okx_usdc/` et `lines.json`, comparés par `tv4 verify`. Le fichier de sous-ensemble est
      # écrit dans un dossier existant (voir docs/specs/s11.md §17). Même réserve que pour les autres fumées :
      # 4 trades sur 7 jours, donc un test de chaîne et de déterminisme, sans résultat (verdict attendu
      # `rejected_too_few_trades`). Les contrôles `jq` portent sur le schéma, le bloc, la garde et l'égalité
      # « trades conservés + purgés = lignes de trades.csv ».
      - name: Backtest de fumée de recherche (bloc DEV, deux lignes), deux process, et tv4 verify
        run: |
          set -euo pipefail
          ./target/debug/tv4 ingest csv --root smoke-s11 --csv fixtures/kraken_xbtusd_1m.csv \
            --exchange kraken --symbol BTC-USD --tf 1m
          ./target/debug/tv4 dataset build --root smoke-s11 --name fumee_dev --exchange kraken \
            --symbol BTC-USD --tf 1m --block DEV
          mkdir -p smoke-s11/subset
          ./target/debug/tv4 universe okx-subset --instruments tv4/tests/fixtures/okx_instruments_spot.json \
            --out smoke-s11/subset/okx_usdc.json
          ./target/debug/tv4 backtest --root smoke-s11 --dataset fumee_dev --strategy sma_cross \
            --params config/strategies/sma_cross.toml --fees okx --symbols BTC-USD \
            --sizing research --capital 300 --out runs/recherche-simple
          for r in a b; do
            ./target/debug/tv4 backtest --root smoke-s11 --dataset fumee_dev --strategy sma_cross \
              --params config/strategies/sma_cross.toml --fees okx --symbols BTC-USD \
              --okx-subset smoke-s11/subset/okx_usdc.json --sizing research --capital 300 --out runs/recherche-$r
          done
          ./target/debug/tv4 verify runs/recherche-a runs/recherche-b
          for d in runs/recherche-simple runs/recherche-a/full runs/recherche-a/okx_usdc; do
            test "$(jq -r .schema "$d/metrics.json")" = "tv4-metrics-s11"
            test "$(jq -r .research.block "$d/metrics.json")" = "DEV"
            test "$(jq -r .research.guard "$d/metrics.json")" = "none"
            test "$(jq -r '.research.purge.trades_kept + .research.purge.trades_purged' "$d/metrics.json")" = "$(( $(wc -l < "$d/trades.csv") - 1 ))"
          done
          test "$(jq -r .schema runs/recherche-a/lines.json)" = "tv4-lines-v1"
          test "$(jq -r .research.line runs/recherche-a/okx_usdc/metrics.json)" = "okx_usdc"
          test "$(jq -r .config_hash runs/recherche-a/full/manifest.json)" = "$(jq -r .config_hash runs/recherche-a/okx_usdc/manifest.json)"
          test "$(jq -r .run_id runs/recherche-a/full/manifest.json)" != "$(jq -r .run_id runs/recherche-a/okx_usdc/manifest.json)"

      # Univers et survivance (docs/specs/s11.md §4.5, §5.3 et §14, lot H) sur un zip construit dans le job : la
      # fixture réelle devient l'entrée `XBTUSD_1.csv`, avec ou sans `MANIFEST.json`. Ce zip n'a que sept jours
      # d'historique : aucune paire n'est éligible et tous les motifs de survivance sont absents. C'est un contrôle
      # de plomberie, pas une mesure. Deux exécutions donnent les mêmes octets (`diff -r`, `cmp`). Sans
      # `MANIFEST.json`, la fin de couverture est inconnue : la commande échoue (code 1) et n'écrit rien, sauf avec
      # `--coverage-end`.
      - name: Fumée de tv4 universe build et survivorship, avec et sans MANIFEST.json
        run: |
          set -euo pipefail
          mkdir -p smoke-univers/src-avec smoke-univers/src-sans
          cp fixtures/kraken_xbtusd_1m.csv smoke-univers/src-avec/XBTUSD_1.csv
          cp fixtures/kraken_xbtusd_1m.csv smoke-univers/src-sans/XBTUSD_1.csv
          printf '%s' '{"product":"ohlcvt","schema_version":1,"release":"r1","has_header":false,"coverage":{"start":"2013-09-11","end":"2020-01-08"},"pairs":1,"files":1,"rows":10000,"generated_at":"2020-01-09"}' \
            > smoke-univers/src-avec/MANIFEST.json
          (cd smoke-univers/src-avec && zip -q ../avec.zip MANIFEST.json XBTUSD_1.csv)
          (cd smoke-univers/src-sans && zip -q ../sans.zip XBTUSD_1.csv)
          avec="$(sha256sum smoke-univers/avec.zip | cut -d' ' -f1)"
          sans="$(sha256sum smoke-univers/sans.zip | cut -d' ' -f1)"
          for r in a b; do
            ./target/debug/tv4 universe build --zip smoke-univers/avec.zip --sha256 "$avec" \
              --out "smoke-univers/univers-$r" --at 2019-12-31T00:00:00Z
            ./target/debug/tv4 universe survivorship --zip smoke-univers/avec.zip --sha256 "$avec" \
              --out "smoke-univers/survivance-$r.json"
          done
          diff -r smoke-univers/univers-a smoke-univers/univers-b
          cmp smoke-univers/survivance-a.json smoke-univers/survivance-b.json
          test "$(jq -r .schema smoke-univers/univers-a/universe.json)" = "tv4-universe-v1"
          jq -e '[.quarters[].members] | length > 0 and all(. == 0)' smoke-univers/univers-a/universe.json
          jq -e '.union | length == 0' smoke-univers/univers-a/universe.json
          test "$(jq -r .schema smoke-univers/survivance-a.json)" = "tv4-survivorship-v1"
          jq -e '[.expected[] | select(.present)] | length == 0' smoke-univers/survivance-a.json
          jq -e '.absent | length == 6' smoke-univers/survivance-a.json
          code=0
          ./target/debug/tv4 universe build --zip smoke-univers/sans.zip --sha256 "$sans" \
            --out smoke-univers/univers-sans || code=$?
          test "$code" = 1
          test ! -e smoke-univers/univers-sans/universe.json
          code=0
          ./target/debug/tv4 universe survivorship --zip smoke-univers/sans.zip --sha256 "$sans" \
            --out smoke-univers/survivance-sans.json || code=$?
          test "$code" = 1
          test ! -e smoke-univers/survivance-sans.json
          ./target/debug/tv4 universe build --zip smoke-univers/sans.zip --sha256 "$sans" \
            --out smoke-univers/univers-sans --coverage-end 2020-01-09T00:00:00Z
          ./target/debug/tv4 universe survivorship --zip smoke-univers/sans.zip --sha256 "$sans" \
            --out smoke-univers/survivance-sans.json --coverage-end 2020-01-09T00:00:00Z
          test -e smoke-univers/univers-sans/universe.json
          test -e smoke-univers/survivance-sans.json

      - name: Publier les runs de fumée
        uses: actions/upload-artifact@v4
        with:
          name: runs-fumee
          path: runs/
          if-no-files-found: error

      # Seuil de lignes (S8) : couverture mesurée à la fin de S8 (96,53 %), arrondie à l'entier inférieur,
      # moins 2 points. Seuil validé par le propriétaire le 28/10 (docs/specs/s8.md §17).
      - name: Couverture
        run: cargo llvm-cov --locked --all-features --workspace --fail-under-lines 94 --lcov --output-path lcov.info

      - name: Résumé de couverture
        run: |
          {
            echo '### Couverture (cargo llvm-cov)'
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier la couverture
        uses: actions/upload-artifact@v4
        with:
          name: couverture-lcov
          path: lcov.info
          if-no-files-found: error

  # Criterion `engine_2y_1m` (docs/03 §8, docs/specs/s8.md §11) : la boucle de `sma_cross` 15m doit rester sous 50 ns
  # par 1m. La porte lit la BORNE BASSE de l'intervalle de la médiane : sur un runner partagé la médiane
  # bouge de quelques dizaines de pour cent, la borne basse ne dépasse le seuil que si même la meilleure
  # estimation est au-dessus (régression grossière : une allocation ou un hachage par bougie). Elle ne
  # prouve pas la performance absolue, mesurée sur le poste du propriétaire.
  bench:
    name: Criterion engine_2y_1m
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Installer Rust 1.97.0
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          toolchain: 1.97.0

      - uses: Swatinem/rust-cache@v2

      - name: Benchmark engine_2y_1m
        run: cargo bench --locked --bench engine -- engine_2y_1m

      - name: Porte sur sma_cross_15m_boucle (borne basse < 50 ns par 1m)
        run: |
          set -euo pipefail
          .github/scripts/criterion-gate.sh \
            target/criterion/engine_2y_1m/sma_cross_15m_boucle/new/estimates.json 1051200 50
          {
            echo '### Criterion engine_2y_1m'
            echo '```json'
            cat bench-summary.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publier les estimations criterion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion-engine-2y-1m
          path: |
            target/criterion/engine_2y_1m/**/new/estimates.json
            bench-summary.json
          if-no-files-found: error

  # Control plane PHP (docs/05, docs/specs/s8.md §14) : Symfony 7.4 LTS, PHP 8.3 (Symfony 8.x exige PHP 8.4.1).
  control-plane:
    name: Control plane (PHP)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - run: composer validate --strict

      - run: composer install --no-interaction --no-progress --no-plugins --prefer-dist

      - run: vendor/bin/phpcs

      - run: vendor/bin/phpstan analyse --no-progress

      - run: vendor/bin/phpunit

      # Informatif : un avis publié sur une dépendance ne doit pas casser un commit sans rapport.
      - run: composer audit
        continue-on-error: true

  # Conformité entre la vraie sortie de `tv4` et les DTO PHP (la fixture du control plane est écrite à la
  # main) : les runs de fumée A (mono-paire s8), du portefeuille (s9), des profils de coûts (s10) et de la
  # recherche (s11, run simple et dossier de lignes) sont rendus en HTML. Le rendu du portefeuille échoue si
  # un bloc obligatoire de s9 y est déclaré absent, celui des profils si une section de s10 manque, celui de
  # la recherche si une section de s11 manque. Les tests PHPUnit `GoldenPortfolioRunTest`,
  # `GoldenProfilesRunTest` et `GoldenResearchLinesTest` font le même contrôle sur les goldens
  # `portfolio_2legs`, `portfolio_profiles` et `research_lines`.
  rapport-bout-en-bout:
    name: Rapport HTML d'un vrai run
    needs: [qualite, control-plane]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Installer le control plane
        working-directory: control-plane
        run: composer install --no-interaction --no-progress --no-plugins --no-dev --prefer-dist

      - name: Récupérer les runs de fumée
        uses: actions/download-artifact@v4
        with:
          name: runs-fumee
          path: runs

      - name: Rendre le rapport du run de fumée
        working-directory: control-plane
        run: php bin/console tv4:report ../runs/fumee-a --output ../rapport-fumee.html

      - name: Rendre le rapport du run de fumée du portefeuille
        working-directory: control-plane
        run: php bin/console tv4:report ../runs/portefeuille-a --output ../rapport-portefeuille.html

      # Le lecteur tolère l'absence d'un bloc s9 (le rendu écrit alors « Ce run ne porte pas de bloc … » et
      # sort en 0) : sans cette étape, un bloc renommé côté Rust ou une clé mal orthographiée côté PHP
      # ferait disparaître une section sans bruit. Un motif par bloc obligatoire ; le régime, facultatif
      # (la stratégie de fumée ne le lit pas), n'en a pas.
      - name: Contrôler les blocs s9 du rapport du portefeuille
        run: |
          statut=0
          for bloc in executability g1_executable funnel_by_pair portfolio priority instruments distribution.by_pair; do
            if grep -qF "Ce run ne porte pas de bloc <code>${bloc}</code>" rapport-portefeuille.html; then
              echo "::error::le rapport du run de fumée du portefeuille ne porte pas le bloc ${bloc}"
              statut=1
            fi
          done
          exit "$statut"

      # Dossier de profils (s10) : `profiles.json` fait rendre la section « Profils de coûts » puis la fiche
      # du profil baseline, qui porte la section « Coûts ». En s10 le lecteur lève une erreur (code de sortie
      # non nul) quand `costs`, `cost_arithmetic` ou `cost_counters` manque ; le contrôle ci-dessous garde
      # aussi le motif « Ce run ne porte pas de bloc » du lecteur s9, et vérifie la présence des deux sections.
      - name: Rendre le rapport du dossier de profils
        working-directory: control-plane
        run: php bin/console tv4:report ../runs/profils-a --output ../rapport-profils.html

      - name: Contrôler les blocs et les sections s10 du rapport des profils
        run: |
          statut=0
          for bloc in costs cost_arithmetic cost_counters profils; do
            if grep -qF "Ce run ne porte pas de bloc <code>${bloc}</code>" rapport-profils.html; then
              echo "::error::le rapport du dossier de profils ne porte pas le bloc ${bloc}"
              statut=1
            fi
          done
          for ancre in profils-titre couts-titre; do
            if ! grep -qF "id=\"${ancre}\"" rapport-profils.html; then
              echo "::error::le rapport du dossier de profils n'a pas la section ${ancre}"
              statut=1
            fi
          done
          exit "$statut"

      # Recherche (s11) : un run en symboles fixes et le dossier de lignes (`lines.json`, `full/`, `okx_usdc/`).
      # En s11 le lecteur lève une erreur (code de sortie non nul) quand le bloc `research` manque ; le contrôle
      # ci-dessous garde aussi le motif « Ce run ne porte pas de bloc » et vérifie que les sections « Deux
      # lignes » (dossier de lignes seulement) et « Recherche » sont rendues, une fois chacune.
      - name: Rendre les rapports du run de recherche et du dossier de lignes
        working-directory: control-plane
        run: |
          php bin/console tv4:report ../runs/recherche-simple --output ../rapport-recherche.html
          php bin/console tv4:report ../runs/recherche-a --output ../rapport-lignes.html

      - name: Contrôler les sections s11 des rapports de recherche
        run: |
          statut=0
          for fichier in rapport-recherche.html rapport-lignes.html; do
            if grep -qF "Ce run ne porte pas de bloc" "$fichier"; then
              echo "::error::le rapport ${fichier} déclare un bloc absent"
              statut=1
            fi
            if [ "$(grep -cF 'id="recherche"' "$fichier")" != "1" ]; then
              echo "::error::le rapport ${fichier} n'a pas exactement une section Recherche"
              statut=1
            fi
          done
          if [ "$(grep -cF 'id="lignes"' rapport-lignes.html)" != "1" ]; then
            echo "::error::le rapport du dossier de lignes n'a pas exactement une section Deux lignes"
            statut=1
          fi
          if grep -qF 'id="lignes"' rapport-recherche.html; then
            echo "::error::le rapport du run simple porte une section Deux lignes"
            statut=1
          fi
          exit "$statut"

      - name: Publier les rapports
        uses: actions/upload-artifact@v4
        with:
          name: rapport-fumee
          path: |
            rapport-fumee.html
            rapport-portefeuille.html
            rapport-profils.html
            rapport-recherche.html
            rapport-lignes.html
          if-no-files-found: error

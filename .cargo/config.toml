# Cible CPU fixe par architecture, jamais `native` (docs/03-architecture.md §4 et §7.4). x86_64 :
# x86-64-v3 = AVX2, BMI2, FMA (Intel depuis Haswell, AMD depuis Zen), même binaire entre la CI et toute
# machine x86_64. Réglage limité aux cibles x86_64 : sur aarch64 (Mac Apple Silicon, Raspberry Pi 5), ce
# processeur n'existe pas ; LLVM l'ignore en le signalant à chaque unité compilée, la cible perd toutes ses
# features, `neon` et le flottant matériel compris, et le binaire calcule faux (constat du 14/10). Les cibles
# aarch64 gardent le CPU par défaut de leur spécification (apple-m1 pour aarch64-apple-darwin), fixe pour la
# toolchain épinglée. Ne pas ajouter de `[build] rustflags` à côté : il s'appliquerait aux cibles aarch64.
[target.'cfg(target_arch = "x86_64")']
rustflags = ["-C", "target-cpu=x86-64-v3"]

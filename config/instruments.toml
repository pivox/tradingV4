# Contraintes d'instrument par exchange et par symbole canonique (docs/04-protocole-recherche.md §3.1
# point 6). Elles entrent dans le config_hash. Les prix sont arrondis au tick, les quantités au lot.

# Kraken BTC-USD (dumps OHLCVT, fixture du dépôt). Tick 0,1 et lot 1e-8 vérifiés sur les 10 000 lignes de
# fixtures/kraken_xbtusd_1m.csv : prix à une décimale au plus, volumes à 1e-8 près (écart relatif
# <= 2,05e-15, artefacts de somme flottante côté Kraken). Minimums à 0 : à valider (S9, issue #11).
# Pour mémoire, OKX BTC-USDC lu le 13/10 sur public/instruments : tickSz 0,1, lotSz 1e-8, minSz 0,0001 BTC
# (aucune entrée OKX en S6 : elles viendront de GET /api/v5/account/instruments, S9).
[kraken.BTC-USD]
tick_size = 0.1
lot_size = 1e-8
min_qty = 0.0
min_notional = 0.0
